<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuseScore Palette</title>
  <style>
    :root { color-scheme: dark; font: -apple-system-body, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 13px; color: #f8fafc; background: #111827; }
    header { display: grid; grid-template-columns: 58px 1fr; gap: 11px; align-items: center; margin-bottom: 12px; }
    #preview { width: 58px; height: 58px; border-radius: 13px; background: #0b1220; box-shadow: inset 0 0 0 1px #334155; }
    h1 { margin: 0 0 3px; font-size: 16px; line-height: 1.25; }
    #selection { margin: 0; color: #94a3b8; font-size: 11px; line-height: 1.35; }
    #items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .item { min-width: 0; display: grid; grid-template-columns: 40px 1fr; gap: 7px; align-items: center; padding: 5px; color: #e2e8f0; text-align: left; background: #1e293b; border: 1px solid #334155; border-radius: 9px; cursor: pointer; }
    .item:hover { background: #263449; border-color: #64748b; }
    .item.selected { background: #0c4a6e; border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf855; }
    .item img { width: 40px; height: 40px; border-radius: 8px; }
    .item span { overflow: hidden; font-size: 10.5px; line-height: 1.25; overflow-wrap: anywhere; }
    #empty { display: none; color: #94a3b8; font-size: 12px; text-align: center; padding: 18px 4px; }
  </style>
</head>
<body>
  <header>
    <img id="preview" alt="選択中のアイコン">
    <div>
      <h1 id="category">MuseScore パレット</h1>
      <p id="selection">項目を選んでください</p>
    </div>
  </header>
  <main id="items"></main>
  <div id="empty">一致する項目がありません。</div>

  <script type="module">
    import {
      categoryIdFromAction,
      findPaletteItemByQuery,
      paletteCategoryMap,
      paletteIcon,
    } from "./palette-shared.js";

    let websocket;
    let context = "";
    let propertyInspectorUUID = "";
    let actionId = "";
    let categoryId = "";
    let settings = { item: "", query: "" };
    let settingsPending = false;

    const itemsRoot = document.getElementById("items");
    const preview = document.getElementById("preview");
    const selection = document.getElementById("selection");

    function category() { return paletteCategoryMap[categoryId]; }

    function sendSettings() {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) {
        settingsPending = true;
        return;
      }
      settingsPending = false;
    websocket.send(JSON.stringify({
      event: "setSettings",
      context: propertyInspectorUUID,
      action: actionId,
      targetContext: context,
      payload: settings,
    }));
    }

    function updateHeader() {
      const currentCategory = category();
      const currentItem = currentCategory?.items.find((entry) => entry.id === settings.item);
      document.getElementById("category").textContent = currentCategory?.label || "MuseScore パレット";
      selection.textContent = currentItem?.label || "下から項目を選んでください";
      preview.src = paletteIcon(categoryId, currentItem?.id || "");
    }

    function renderItems() {
      const visible = category()?.items || [];
      itemsRoot.replaceChildren();
      for (const entry of visible) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `item${settings.item === entry.id ? " selected" : ""}`;
        button.title = entry.label;
        const image = document.createElement("img");
        image.src = paletteIcon(categoryId, entry.id);
        image.alt = "";
        const text = document.createElement("span");
        text.textContent = entry.label;
        button.append(image, text);
        button.onclick = () => {
          settings = { item: entry.id, query: "" };
          updateHeader();
          renderItems();
          sendSettings();
        };
        itemsRoot.append(button);
      }
      document.getElementById("empty").style.display = visible.length ? "none" : "block";
    }

    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
      const action = JSON.parse(actionInfo);
      categoryId = categoryIdFromAction(action.action || "");
      context = action.context || "";
      propertyInspectorUUID = uuid;
      actionId = [action.action, action.actionId, action.uuid, action.payload?.action]
        .find((candidate) => typeof candidate === "string" && candidate.startsWith("com.codex.musescore-control.palette.")) || "";
      const incoming = action.payload?.settings || {};
      const firstItem = paletteCategoryMap[categoryId]?.items[0]?.id || "";
      const migratedItem = incoming.item ? undefined : findPaletteItemByQuery(categoryId, incoming.query || "");
      settings = {
        item: incoming.item || migratedItem?.id || firstItem,
        query: "",
      };
      updateHeader();
      renderItems();
      websocket = new WebSocket(`ws://127.0.0.1:${port}`);
      websocket.onopen = () => {
        websocket.send(JSON.stringify({ event: registerEvent, uuid }));
        if (settingsPending || migratedItem) sendSettings();
      };
    };
  </script>
</body>
</html>
