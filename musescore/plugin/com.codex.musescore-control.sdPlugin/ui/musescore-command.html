<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      .note { color: #777; font-size: 12px; padding: 8px 0; }
    </style>
  </head>
  <body>
    <sdpi-item label="操作">
      <sdpi-select setting="command" default="duration-quarter">
        <optgroup label="音価・入力">
        <option value="duration-64">64分音符</option>
        <option value="duration-32">32分音符</option>
        <option value="duration-16">16分音符</option>
        <option value="duration-8">8分音符</option>
        <option value="duration-quarter">4分音符</option>
        <option value="duration-half">2分音符</option>
        <option value="duration-whole">全音符</option>
        <option value="duration-double-whole">倍全音符</option>
        <option value="duration-longa">ロンガ</option>
        <option value="dot">付点</option>
        <option value="double-dot">複付点</option>
        </optgroup>
        <optgroup label="臨時記号・アーティキュレーション">
        <option value="sharp">シャープ</option>
        <option value="flat">フラット</option>
        <option value="natural">ナチュラル</option>
        <option value="tie">タイ</option>
        <option value="slur">スラー</option>
        <option value="staccato">スタッカート</option>
        <option value="accent">アクセント</option>
        <option value="marcato">マルカート</option>
        <option value="tenuto">テヌート</option>
        </optgroup>
        <optgroup label="連符">
        <option value="tuplet-2">2連符</option>
        <option value="tuplet-3">3連符</option>
        <option value="tuplet-4">4連符</option>
        <option value="tuplet-5">5連符</option>
        <option value="tuplet-6">6連符</option>
        <option value="tuplet-7">7連符</option>
        <option value="tuplet-8">8連符</option>
        <option value="tuplet-9">9連符</option>
        <option value="tuplet-custom">任意のn連符（MuseScoreで入力）</option>
        </optgroup>
        <optgroup label="ボイス・入力モード">
        <option value="flip">符幹の反転</option>
        <option value="voice-1">ボイス 1</option>
        <option value="voice-2">ボイス 2</option>
        <option value="voice-3">ボイス 3</option>
        <option value="voice-4">ボイス 4</option>
        <option value="note-input-toggle">音名入力モード</option>
        <option value="input-duration">音価入力モード</option>
        <option value="input-repitch-toggle">再入力モード</option>
        <option value="input-insert-toggle">挿入モード</option>
        <option value="selection-mode">選択モード</option>
        </optgroup>
        <optgroup label="小節・編集">
        <option value="repeat-selection">選択範囲を反復</option>
        <option value="delete-selected-measures">選択小節を削除</option>
        </optgroup>
        <optgroup label="表示・再生">
        <option value="zoom-in">ズームイン</option>
        <option value="zoom-out">ズームアウト</option>
        <option value="play">再生</option>
        <option value="stop">停止</option>
        <option value="play-stop">再生 / 停止</option>
        <option value="mixer">ミキサー表示</option>
        </optgroup>
        <optgroup label="パレット・レイアウト">
        <option value="show-palettes">パレット表示</option>
        <option value="master-palette">マスターパレット</option>
        </optgroup>
        <optgroup label="ファイル・ツール">
        <option value="save">保存</option>
        <option value="save-as">名前をつけて保存</option>
        <option value="fill-slashes">スラッシュで埋める</option>
        <option value="toggle-rhythmic-slash">リズムスラッシュ切替</option>
        <option value="explode">分散（Explode）</option>
        <option value="implode">集約（Implode）</option>
        <option value="page-settings">ページ設定</option>
        <option value="metronome">メトロノーム</option>
        <option value="rewind">巻き戻し</option>
        </optgroup>
        <optgroup label="その他">
        <option value="chord-symbol">コード入力</option>
        </optgroup>
      </sdpi-select>
    </sdpi-item>
    <div class="note">
      MuseScore 4.7 の macOS 標準ショートカットを使用します。<br />
      初回利用時は、Stream Deck にアクセシビリティ権限を許可してください。
    </div>
  </body>
</html>
